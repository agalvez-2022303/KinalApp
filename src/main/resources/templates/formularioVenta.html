<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Venta — KinalApp</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #f5f5f0; --surface: #ffffff; --border: #ddddd8;
            --text: #1a1a1a; --muted: #888880; --accent: #2a5caa;
            --accent-hover: #1e4488; --nav-bg: #1a1a1a; --nav-text: #f0f0eb;
            --nav-muted: #888880; --error-bg: #fff0f0; --error-border: #e5b3b3;
            --error-text: #c0392b;
        }

        body { font-family: 'Georgia', serif; background: var(--bg); color: var(--text); min-height: 100vh; }

        nav {
            background: var(--nav-bg); padding: 0 32px;
            display: flex; align-items: center; justify-content: space-between;
            height: 56px; position: sticky; top: 0; z-index: 100;
        }

        .nav-brand { font-size: 16px; letter-spacing: 3px; text-transform: uppercase; color: var(--nav-text); }
        .nav-links { display: flex; gap: 0; list-style: none; }
        .nav-links a {
            display: block; padding: 0 18px; height: 56px; line-height: 56px;
            font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
            text-decoration: none; color: var(--nav-muted);
            font-family: 'Courier New', monospace; transition: color 0.2s, background 0.2s;
        }
        .nav-links a:hover, .nav-links a.active { color: var(--nav-text); background: rgba(255,255,255,0.06); }
        .nav-user { font-size: 11px; font-family: 'Courier New', monospace; color: var(--nav-muted); display: flex; align-items: center; gap: 16px; }
        .nav-user span { color: var(--nav-text); }
        .nav-user a { color: var(--nav-muted); text-decoration: none; transition: color 0.2s; }
        .nav-user a:hover { color: #e07070; }

        main { max-width: 700px; margin: 0 auto; padding: 40px 24px; }

        .breadcrumb {
            font-size: 11px; font-family: 'Courier New', monospace;
            color: var(--muted); margin-bottom: 24px;
        }

        .breadcrumb a { color: var(--accent); text-decoration: none; }
        .breadcrumb a:hover { text-decoration: underline; }

        .page-header { margin-bottom: 28px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
        .page-header h2 { font-size: 22px; font-weight: normal; letter-spacing: 1px; }
        .page-header p { font-size: 12px; color: var(--muted); margin-top: 4px; font-family: 'Courier New', monospace; }

        .alert { padding: 10px 14px; font-size: 13px; margin-bottom: 20px; border: 1px solid; font-family: 'Courier New', monospace; }
        .alert-error { background: var(--error-bg); border-color: var(--error-border); color: var(--error-text); }

        .card { background: var(--surface); border: 1px solid var(--border); padding: 32px; }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-row.single { grid-template-columns: 1fr; }

        .form-group { margin-bottom: 22px; }

        label {
            display: block; font-size: 10px; letter-spacing: 2px;
            text-transform: uppercase; color: var(--muted);
            margin-bottom: 6px; font-family: 'Courier New', monospace;
        }

        input[type="text"], input[type="number"], input[type="date"],
        select, textarea {
            width: 100%; padding: 10px 12px;
            border: 1px solid var(--border); background: var(--bg);
            font-size: 14px; color: var(--text); font-family: 'Georgia', serif;
            outline: none; transition: border-color 0.2s;
            appearance: none;
        }

        input:focus, select:focus, textarea:focus { border-color: var(--accent); }

        select { cursor: pointer; }

        textarea { resize: vertical; min-height: 80px; }

        .section-divider {
            font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
            color: var(--muted); font-family: 'Courier New', monospace;
            border-top: 1px solid var(--border); padding-top: 20px; margin-bottom: 20px;
        }

        .form-actions { display: flex; gap: 12px; margin-top: 8px; }

        .btn {
            display: inline-block; padding: 10px 24px; font-size: 11px;
            letter-spacing: 1.5px; text-transform: uppercase; text-decoration: none;
            font-family: 'Courier New', monospace; cursor: pointer; border: none;
            transition: background 0.2s;
        }

        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-secondary { background: transparent; color: var(--muted); border: 1px solid var(--border); }
        .btn-secondary:hover { background: var(--bg); color: var(--text); }
    </style>
</head>
<body>

<nav>
    <span class="nav-brand">KinalApp</span>
    <ul class="nav-links">
        <li><a th:href="@{/dashboard}">Inicio</a></li>
        <li><a th:href="@{/ventas}" class="active">Ventas</a></li>
        <li><a th:href="@{/clientes}">Clientes</a></li>
        <li><a th:href="@{/productos}">Productos</a></li>
        <li><a th:href="@{/usuarios}">Usuarios</a></li>
    </ul>
    <div class="nav-user">
        Hola, <span th:text="${session.usuarioLogueado?.username ?: 'Usuario'}">Usuario</span>
        &nbsp;|&nbsp;
        <a th:href="@{/logout}">Salir</a>
    </div>
</nav>

<main>
    <div class="breadcrumb">
        <a th:href="@{/ventas}">Ventas</a> &nbsp;/&nbsp; Nueva Venta
    </div>

    <div class="page-header">
        <h2 th:text="${viewTitle ?: 'Registrar Nueva Venta'}">Registrar Nueva Venta</h2>
        <p>Completa los datos de la transacción</p>
    </div>

    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <div class="card">
        <form th:action="@{/ventas/guardar}" th:object="${venta}" method="post">

            <!-- Datos principales -->
            <div class="section-divider">Datos de la Venta</div>

            <div class="form-row">
                <div class="form-group">
                    <label for="fechaVenta">Fecha de Venta</label>
                    <input type="date" id="fechaVenta" th:field="*{fechaVenta}" required>
                </div>
                <div class="form-group">
                    <label for="codigoVenta">Código de Venta</label>
                    <input type="text" id="codigoVenta" th:field="*{codigoVenta}" placeholder="Ej: VNT-001">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="cliente">Cliente</label>
                    <select id="cliente" th:field="*{cliente}" required>
                        <option value="">— Selecciona un cliente —</option>
                        <option th:each="c : ${clientes}"
                                th:value="${c.DPICliente}"
                                th:text="${c.nombreCliente + ' ' + c.apellidoCliente}">
                        </option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="usuario">Vendedor / Usuario</label>
                    <select id="usuario" th:field="*{usuario}" required>
                        <option value="">— Selecciona un usuario —</option>
                        <option th:each="u : ${usuarios}"
                                th:value="${u.codigoUsuario}"
                                th:text="${u.username}">
                        </option>
                    </select>
                </div>
            </div>

            <!-- Producto y monto -->
            <div class="section-divider">Producto y Monto</div>

            <div class="form-row">
                <div class="form-group">
                    <label for="producto">Producto</label>
                    <select id="producto" th:field="*{producto}">
                        <option value="">— Selecciona un producto —</option>
                        <option th:each="p : ${productos}"
                                th:value="${p.codigoProducto}"
                                th:text="${p.nombreProducto}">
                        </option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="total">Total (Q)</label>
                    <input type="number" id="total" th:field="*{total}" step="0.01" min="0" placeholder="0.00" required>
                </div>
            </div>

            <!-- Observaciones -->
            <div class="section-divider">Observaciones</div>

            <div class="form-row single">
                <div class="form-group">
                    <label for="observaciones">Notas adicionales</label>
                    <textarea id="observaciones" th:field="*{observaciones}" placeholder="Escribe cualquier observación..."></textarea>
                </div>
            </div>

            <!-- Botones -->
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Guardar Venta</button>
                <a th:href="@{/ventas}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</main>

</body>
</html>
